name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    env:
      GOTELEMETRY: off
      DISABLE_AUTOUPDATER: '1'
      DISABLE_TELEMETRY: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shard: 1
          - os: windows-latest
            shard: 2
          - os: ubuntu-latest
          - os: macos-latest
    name: test (${{ matrix.os }}${{ matrix.shard && format(', {0}/2', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod

      - name: Vet Go packages
        if: matrix.os != 'windows-latest' || matrix.shard == 1
        run: go vet ./...
        working-directory: go

      - name: Test Go packages
        if: matrix.os != 'windows-latest'
        run: go test ./...
        working-directory: go

      - name: Test Go packages outside enforce
        if: matrix.os == 'windows-latest' && matrix.shard == 1
        run: go test $(go list ./... | grep -v '/internal/enforce$')
        shell: bash
        working-directory: go

      - name: Test enforce package
        if: matrix.os == 'windows-latest' && matrix.shard == 2
        run: go test ./internal/enforce
        shell: bash
        working-directory: go

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.300
        shell: bash

      - name: Validate Claude plugin
        if: matrix.os != 'windows-latest' || matrix.shard == 1
        run: claude plugin validate . --strict
        shell: bash

      - name: Test Claude plugin
        if: matrix.os != 'windows-latest' || matrix.shard == 1
        run: claude plugin test .
        shell: bash
